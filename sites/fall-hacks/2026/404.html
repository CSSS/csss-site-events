<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Fall Hacks 2026</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Geist+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #000;
        background: #fdfcf0;
        font-family: 'Geist Mono', monospace;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 1rem;
        max-width: 36rem;
        text-align: center;
      }

      .code {
        margin: 0;
        color: #000;
        font-family: 'Cal Sans', sans-serif;
        font-size: clamp(5rem, 20vw, 12rem);
        line-height: 0.8;
      }

      h1 {
        margin: 0;
        font-family: 'Cal Sans', sans-serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 400;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2.5vw, 1.125rem);
      }

      a {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        color: #fdfcf0;
        background: #000;
        border: 1.5px solid #000;
        border-radius: 15px;
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:hover,
      a:focus-visible {
        color: #000;
        background: #fdfcf0;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <p class="code" aria-hidden="true">404</p>
      <h1 id="not-found-title">Page not found</h1>
      <p>Hey, you aren't suppose to be here! Let's get you back.</p>
      <a href="/">Back to Fall Hacks 2026</a>
    </main>
  </body>
</html>
